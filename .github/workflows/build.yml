name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish APK to apk branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          VER=$(grep -m1 versionName app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          URL="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          rm -rf /tmp/apkout
          if git clone -q --depth 1 -b apk "$URL" /tmp/apkout 2>/dev/null; then
            echo "apk branch exists"
          else
            mkdir /tmp/apkout
            cd /tmp/apkout
            git init -q
            git checkout -q -b apk
            git remote add origin "$URL"
          fi
          cd /tmp/apkout
          cp "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" "alarm-v${VER}.apk"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -qm "APK v${VER}"
          git push -q origin apk
          echo "Download: https://github.com/${REPO}/raw/apk/alarm-v${VER}.apk"
